services:
  db:
    image: pgvector/pgvector:pg16
    container_name: studypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studypilot
      POSTGRES_PASSWORD: studypilot_password
      POSTGRES_DB: studypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studypilot -d studypilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
